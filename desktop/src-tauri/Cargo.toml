[package]
name = "canvas-app"
version = "0.4.0"
description = "Canvas desktop app: a native window onto the running canvas service"
edition = "2021"
# Tauri 2.12 needs Rust 1.90.
rust-version = "1.90"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
base64 = "0.22"
flate2 = "1"
percent-encoding = "2"
serde_json = "1"
tauri-plugin-opener = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
