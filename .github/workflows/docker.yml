name: Docker image

# Builds the service image from the linux release archives for both architectures and checks that /health answers from outside
# the container. Called by ci.yml (every PR) and release.yml; it never publishes, the release workflow's docker job does.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker buildx build --platform "linux/${{ matrix.arch }}" --build-arg "VERSION=$version" -f packaging/docker/Dockerfile --load -t canvas:test release

      # arm64 runs under QEMU here, so give the service time to start.
      - name: /health answers from outside the container
        run: |
          docker run -d --name canvas -p 43120:43120 canvas:test
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:43120/health > health.json && break
            sleep 1
          done
          docker logs canvas
          cat health.json
          node -e "const h = JSON.parse(require('fs').readFileSync('health.json')); if (!h.ok || h.service !== 'canvas-service' || !h.version) process.exit(1)"
          curl -fsS -o /dev/null http://127.0.0.1:43120/

      # /health reports the bundled service's version, so the canvas version is checked on the binary the image runs.
      - name: The image runs the archive it was built for
        run: |
          [ "$(docker run --rm --entrypoint canvas canvas:test --version)" = "canvas $VERSION" ] || { echo "the image does not run canvas $VERSION" >&2; exit 1; }
          [ "$(docker image inspect canvas:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION" ]

      - name: The service runs as an unprivileged user and keeps its projects in /data
        run: |
          [ "$(docker exec canvas id -u)" != 0 ] || { echo "the service runs as root" >&2; exit 1; }
          docker exec canvas test -f /data/service.json
