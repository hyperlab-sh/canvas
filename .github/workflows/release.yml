name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      # Trusted publishing (OIDC): configure this repo and workflow as a trusted publisher on npmjs.com, no token needed.
      # It needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
