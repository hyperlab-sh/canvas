name: Release

on:
  push:
    tags: ["v*"]
  # dry_run builds and verifies everything and publishes nothing (the publishing jobs are skipped).
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # Standalone binaries (no node or bun needed), attached to the GitHub release and used by install.sh, install.ps1 and the Homebrew tap.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      - run: bun scripts/package-native.mjs darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*
          if-no-files-found: error

  packages:
    needs: binaries
    uses: ./.github/workflows/packages.yml

  # The desktop app bundles; they are attached to the release below and added to SHA256SUMS by the app workflow.
  app:
    needs: [binaries, packages]
    uses: ./.github/workflows/app.yml

  # The dry run of the tap: the formula and the cask installed from a local tap against these assets.
  brew:
    needs: [binaries, app]
    uses: ./.github/workflows/brew.yml

  # The signed apt and yum trees, built and installed from in clean containers; only repos-publish below pushes them.
  repos:
    needs: [packages, app]
    uses: ./.github/workflows/repos.yml
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    secrets: inherit

  # The dry run builds and checks the image; only the docker job below pushes it.
  docker-check:
    needs: binaries
    uses: ./.github/workflows/docker.yml

  github-release:
    needs: [binaries, packages, app]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release

      # Last, so its SHA256SUMS (the archives, the distro packages and the app bundles) is the one released.
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # C-5/C-6: what was published carries the distro package and app bundle names and checksums that match the downloaded assets.
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort > assets.txt
          app_assets="$(node scripts/app-assets.mjs expected "$version")"
          for f in "canvas_${version}_amd64.deb" "canvas_${version}_arm64.deb" "canvas-${version}-1.x86_64.rpm" "canvas-${version}-1.aarch64.rpm" $app_assets SHA256SUMS; do
            grep -qxF "$f" assets.txt || { echo "release asset $f is missing" >&2; exit 1; }
          done
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -D verify
          cd verify
          for f in "canvas_${version}_amd64.deb" "canvas_${version}_arm64.deb" "canvas-${version}-1.x86_64.rpm" "canvas-${version}-1.aarch64.rpm" $app_assets; do
            grep -qF "  $f" SHA256SUMS || { echo "$f is not in SHA256SUMS" >&2; exit 1; }
          done
          sha256sum -c SHA256SUMS

  # Pushes the checked trees to gh-pages (served at https://hyperlab-sh.github.io/canvas/). Prior versions stay in the pools.
  repos-publish:
    needs: [repos, github-release]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    env:
      RELEASE_URL: https://hyperlab-sh.github.io/canvas
    steps:
      # The scripts come from the tag; the site from gh-pages as it is now.
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: repos
          path: ${{ runner.temp }}/repos

      # The checked trees extend the gh-pages commit the repos job saw. If another release pushed since, they would drop its
      # packages, so the trees are built again on the current gh-pages with the same script and key. Re-running this job alone
      # recovers from that.
      - name: gh-pages has not moved since the trees were built
        id: moved
        run: |
          if [ "$(git -C site rev-parse HEAD)" = "${{ needs.repos.outputs.base_sha }}" ]; then echo "moved=false" >> "$GITHUB_OUTPUT"; else echo "gh-pages moved while this release was built; rebuilding the trees on it"; echo "moved=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        if: steps.moved.outputs.moved == 'true'
        with:
          name: packages
          path: in/packages

      - uses: actions/download-artifact@v4
        if: steps.moved.outputs.moved == 'true'
        with:
          name: app
          path: in/app

      - name: Rebuild the trees
        if: steps.moved.outputs.moved == 'true'
        env:
          REPO_BASE_URL: ${{ env.RELEASE_URL }}
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_EXPECT_FPR: CBE706A42B7AED6141667D695239F12AF24A7030
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm gnupg dpkg-dev
          src/packaging/repos/build.sh site in/packages in/app

      - name: Use the checked trees
        if: steps.moved.outputs.moved == 'false'
        run: cp -a "$RUNNER_TEMP/repos/." site/

      # gh-pages keeps no history: the site is one parentless commit forced over the commit it was built on (the lease), so old
      # packages do not pile up in the repository. The lease also fails the push if gh-pages moves in the meantime.
      - name: Publish the trees as a single commit
        run: |
          cd site
          base="$(git rev-parse HEAD)"
          git config user.name "canvas release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "repositories unchanged"; exit 0; }
          git checkout --orphan pages-new
          git add -A
          git commit -m "chore(repos): canvas ${GITHUB_REF_NAME#v}"
          git push --force-with-lease="gh-pages:$base" origin HEAD:gh-pages

      # Pages deploys after the push and its CDN may keep the old file for ten minutes; ask with a fresh query string and wait up to 20.
      - name: Pages serves it
        run: |
          for _ in $(seq 1 80); do
            curl -fsS "$RELEASE_URL/apt/dists/stable/InRelease?ts=$(date +%s)" -o "$RUNNER_TEMP/InRelease" && cmp -s "$RUNNER_TEMP/InRelease" site/apt/dists/stable/InRelease && exit 0
            sleep 15
          done
          echo "Pages does not serve the pushed InRelease" >&2
          exit 1

  # ghcr.io/hyperlab-sh/canvas:<version> and :latest for amd64 and arm64, pushed only after the checked image and the release exist.
  # GHCR creates the package private on the first push: set it to public once in the package settings (like the manual first npm publish).
  docker:
    needs: [binaries, docker-check, github-release]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "ghcr.io/hyperlab-sh/canvas:$version")
          # A prerelease (0.4.0-rc.1) never moves :latest.
          case "$version" in *-*) ;; *) tags+=(-t ghcr.io/hyperlab-sh/canvas:latest) ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "VERSION=$version" -f packaging/docker/Dockerfile "${tags[@]}" --push release

      # Each pushed architecture is pulled and run; arm64 runs under QEMU.
      - name: The pushed images answer /health
        run: |
          image="ghcr.io/hyperlab-sh/canvas:${GITHUB_REF_NAME#v}"
          port=43120
          for arch in amd64 arm64; do
            docker run -d --name "canvas-$arch" --platform "linux/$arch" -p "$port:43120" "$image"
            ok=
            for _ in $(seq 1 60); do curl -fsS "http://127.0.0.1:$port/health" && ok=1 && break; sleep 1; done
            [ -n "$ok" ] || { docker logs "canvas-$arch"; echo "$arch did not answer /health" >&2; exit 1; }
            echo
            port=$((port + 1))
          done

  # D7: the flake reads nix/release.json, which only exists once the release does. The dry run regenerates it from the built
  # archives and shows the diff without committing.
  nix:
    needs: [binaries, github-release]
    if: ${{ !cancelled() && needs.binaries.result == 'success' && (needs.github-release.result == 'success' || (inputs.dry_run && needs.github-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && 'main' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Regenerate nix/release.json from SHA256SUMS
        run: |
          if [ "$PUBLISH" = true ]; then version="${GITHUB_REF_NAME#v}"; else version="$(node -p "require('./package.json').version")"; fi
          node scripts/render-nix-release.mjs "$version" release/SHA256SUMS > nix/release.json
          git diff --stat -- nix/release.json
          cat nix/release.json

      - uses: cachix/install-nix-action@v31

      # Evaluates only, so it needs no published archives: the dry run proves the flake accepts the regenerated file.
      - name: The flake evaluates with it
        run: nix flake check --all-systems

      # The archives are only downloadable once the release exists, so a dry run cannot run them.
      - name: nix run prints the released version
        if: env.PUBLISH == 'true'
        run: |
          [ "$(nix run .# -- --version)" = "canvas ${GITHUB_REF_NAME#v}" ] || { echo "nix run does not print the released version" >&2; exit 1; }

      - name: Commit it to main
        if: env.PUBLISH == 'true'
        run: |
          git config user.name "canvas release"
          git config user.email "actions@users.noreply.github.com"
          git add nix/release.json
          git diff --cached --quiet && { echo "nix/release.json unchanged"; exit 0; }
          git commit -m "chore(nix): release ${GITHUB_REF_NAME#v}"
          git pull --rebase origin main
          git push origin HEAD:main

  # Needs the HOMEBREW_TAP_DEPLOY_KEY secret: the private half of a write deploy key on hyperlab-sh/homebrew-tap. Without it the formula and the cask are only printed.
  homebrew:
    needs: [github-release, brew]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      # Last, so its SHA256SUMS (which also lists the archives and the app bundles) is the one read.
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the formula and the cask
        run: |
          node scripts/render-formula.mjs "${GITHUB_REF_NAME#v}" release > canvas.rb && cat canvas.rb
          node scripts/render-cask.mjs "${GITHUB_REF_NAME#v}" release > canvas-app.rb && cat canvas-app.rb

      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the formula and the cask were not pushed to hyperlab-sh/homebrew-tap"; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:hyperlab-sh/homebrew-tap.git tap
          mkdir -p tap/Formula tap/Casks
          cp canvas.rb tap/Formula/canvas.rb
          cp canvas-app.rb tap/Casks/canvas-app.rb
          cd tap
          git config user.name "canvas release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/canvas.rb Casks/canvas-app.rb
          git diff --cached --quiet && { echo "formula and cask unchanged"; exit 0; }
          git commit -m "canvas ${GITHUB_REF_NAME#v}"
          git push

  publish:
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      # Trusted publishing (OIDC): configure this repo and workflow as a trusted publisher on npmjs.com, no token needed.
      # It needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
