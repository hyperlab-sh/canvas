name: Release

on:
  push:
    tags: ["v*"]
  # dry_run builds and verifies everything and publishes nothing (the publishing jobs are skipped).
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # Standalone binaries (no node or bun needed), attached to the GitHub release and used by install.sh, install.ps1 and the Homebrew tap.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      - run: bun scripts/package-native.mjs darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*
          if-no-files-found: error

  packages:
    needs: binaries
    uses: ./.github/workflows/packages.yml

  github-release:
    needs: [binaries, packages]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # C-5/C-6: what was published carries the distro package names and checksums that match the downloaded assets.
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort > assets.txt
          for f in "canvas_${version}_amd64.deb" "canvas_${version}_arm64.deb" "canvas-${version}-1.x86_64.rpm" "canvas-${version}-1.aarch64.rpm" SHA256SUMS; do
            grep -qxF "$f" assets.txt || { echo "release asset $f is missing" >&2; exit 1; }
          done
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -D verify
          cd verify
          for f in "canvas_${version}_amd64.deb" "canvas_${version}_arm64.deb" "canvas-${version}-1.x86_64.rpm" "canvas-${version}-1.aarch64.rpm"; do
            grep -qF "  $f" SHA256SUMS || { echo "$f is not in SHA256SUMS" >&2; exit 1; }
          done
          sha256sum -c SHA256SUMS

  # Needs the HOMEBREW_TAP_DEPLOY_KEY secret: the private half of a write deploy key on hyperlab-sh/homebrew-tap. Without it the formula is only printed.
  homebrew:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the formula
        run: node scripts/render-formula.mjs "${GITHUB_REF_NAME#v}" release > canvas.rb && cat canvas.rb

      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the formula was not pushed to hyperlab-sh/homebrew-tap"; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:hyperlab-sh/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp canvas.rb tap/Formula/canvas.rb
          cd tap
          git config user.name "canvas release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/canvas.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "canvas ${GITHUB_REF_NAME#v}"
          git push

  publish:
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      # Trusted publishing (OIDC): configure this repo and workflow as a trusted publisher on npmjs.com, no token needed.
      # It needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
