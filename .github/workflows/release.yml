name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # Standalone binaries (no node or bun needed), attached to the GitHub release and used by install.sh, install.ps1 and the Homebrew tap.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: The tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      - run: bun scripts/package-native.mjs darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # Needs a HOMEBREW_TAP_TOKEN secret (a token that can push to hyperlab-sh/homebrew-tap); without it the formula is only printed.
  homebrew:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the formula
        run: node scripts/render-formula.mjs "${GITHUB_REF_NAME#v}" release > canvas.rb && cat canvas.rb

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN is not set; the formula was not pushed to hyperlab-sh/homebrew-tap"; exit 0; fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hyperlab-sh/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp canvas.rb tap/Formula/canvas.rb
          cd tap
          git config user.name "canvas release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/canvas.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "canvas ${GITHUB_REF_NAME#v}"
          git push

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }

      - run: npm run build

      # Trusted publishing (OIDC): configure this repo and workflow as a trusted publisher on npmjs.com, no token needed.
      # It needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
