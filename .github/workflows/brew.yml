name: Homebrew

# Installs the formula (Linux x64, Linux arm64, macOS) and the canvas-app cask (macOS) from a local tap, rendered by the same
# scripts the release uses against the dry-run assets, which a local file server stands in for. Called by ci.yml (every PR)
# and release.yml (before the tap is pushed); it never publishes. Needs the caller's "release" and "app" artifacts.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  formula:
    name: formula (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately the "app" artifact too, though only for its SHA256SUMS (which lists the archives as well): the formula is
      # rendered against the exact SHA256SUMS the release ships, so this job waits for the app workflow.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: assets

      - name: Put brew on PATH
        run: |
          if ! command -v brew > /dev/null; then
            for prefix in /home/linuxbrew/.linuxbrew /opt/homebrew /usr/local; do [ -x "$prefix/bin/brew" ] && eval "$("$prefix/bin/brew" shellenv)" && break; done
          fi
          # Linux arm64 images do not ship Homebrew.
          if ! command -v brew > /dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew --version
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> "$GITHUB_ENV"
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> "$GITHUB_ENV"

      - name: brew install and brew test
        run: |
          version="$(node -p "require('./package.json').version")"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory assets > "$RUNNER_TEMP/server.log" 2>&1 &
          trap 'kill $!' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8000/SHA256SUMS
          brew tap-new --no-git hyperlab-sh/tap
          brew trust hyperlab-sh/tap 2> /dev/null || true
          tap="$(brew --repository hyperlab-sh/tap)"
          mkdir -p "$tap/Formula"
          node scripts/render-formula.mjs "$version" assets --base http://127.0.0.1:8000 > "$tap/Formula/canvas.rb"
          brew install hyperlab-sh/tap/canvas
          brew test hyperlab-sh/tap/canvas
          canvas --version

  cask:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: assets

      - name: Audit the cask
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap-new --no-git hyperlab-sh/tap
          tap="$(brew --repository hyperlab-sh/tap)"
          mkdir -p "$tap/Casks"
          node scripts/render-cask.mjs "$(node scripts/app-assets.mjs version)" assets > "$tap/Casks/canvas-app.rb"
          # Current Homebrew's style rules reject `postflight` (A5 needs it: there is no quarantine step in postflight_steps).
          # Reported, not gating; audit gates.
          brew style --cask hyperlab-sh/tap/canvas-app || echo "::warning::brew style findings on the cask (see the log)"
          brew audit --cask hyperlab-sh/tap/canvas-app

      # Homebrew quarantines cask downloads by default (a user install does the same). The postflight is proven to matter:
      # the cached dmg carries the quarantine, a copy of the cask without the postflight leaves the app quarantined, and
      # only the real cask leaves it clean.
      - name: Install the cask, check the quarantine, smoke the app
        run: |
          unset HOMEBREW_CASK_OPTS
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          version="$(node -p "require('./package.json').version")"
          app_version="$(node scripts/app-assets.mjs version)"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory assets > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill $server $serve 2> /dev/null || true' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8000/SHA256SUMS
          tap="$(brew --repository hyperlab-sh/tap)"
          mkdir -p "$tap/Formula"
          node scripts/render-formula.mjs "$version" assets --base http://127.0.0.1:8000 > "$tap/Formula/canvas.rb"
          node scripts/render-cask.mjs "$app_version" assets --base http://127.0.0.1:8000 > "$RUNNER_TEMP/canvas-app.rb"
          app=/Applications/Canvas.app

          # Without the postflight: the app must come out quarantined, or the check below proves nothing.
          awk '/^  postflight do$/ { skip = 1 } !skip { print } skip && /^  end$/ { skip = 0 }' "$RUNNER_TEMP/canvas-app.rb" > "$tap/Casks/canvas-app.rb"
          if grep -q postflight "$tap/Casks/canvas-app.rb"; then echo "the postflight was not removed from the control cask" >&2; exit 1; fi
          # The documented order: the formula by full name, then the cask. Homebrew trusts only the item named, so a
          # cask-only install of a fresh tap refuses the cask's formula dependency.
          brew install hyperlab-sh/tap/canvas
          brew install --cask hyperlab-sh/tap/canvas-app 2>&1 | tee "$RUNNER_TEMP/install-control.log"
          dmg="$(brew --cache --cask hyperlab-sh/tap/canvas-app)"
          xattr -p com.apple.quarantine "$dmg" || { echo "Homebrew did not quarantine the downloaded dmg: $dmg" >&2; exit 1; }
          xattr -r "$app" | grep -q com.apple.quarantine || { echo "the app is not quarantined without the postflight, so the check proves nothing" >&2; exit 1; }
          brew uninstall --cask hyperlab-sh/tap/canvas-app
          test ! -e "$app"

          # The real cask.
          cp "$RUNNER_TEMP/canvas-app.rb" "$tap/Casks/canvas-app.rb"
          brew install --cask hyperlab-sh/tap/canvas-app 2>&1 | tee "$RUNNER_TEMP/install.log"
          if grep -q "postflight.*deprecated" "$RUNNER_TEMP/install.log"; then
            echo "::warning::Homebrew deprecates the cask postflight; A5 relies on it (no xattr step in postflight_steps). Users can run: xattr -dr com.apple.quarantine /Applications/Canvas.app"
          fi
          brew list --formula canvas

          test -d "$app"
          xattr -r "$app" || true
          if xattr -r "$app" | grep -q com.apple.quarantine; then echo "$app is still quarantined" >&2; exit 1; fi

          export OPENFLOWKIT_SERVICE_CONFIG="$RUNNER_TEMP/service.json"
          "$(brew --prefix)/bin/canvas" serve --port 43120 &
          serve=$!
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:43120/health
          "$app/Contents/MacOS/canvas-app" --version
          "$app/Contents/MacOS/canvas-app" --smoke | tee "$RUNNER_TEMP/smoke.json"
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").pop()); if (!r.ok || !r.mounted) { console.error("the editor did not mount"); process.exit(1); }' "$RUNNER_TEMP/smoke.json"
